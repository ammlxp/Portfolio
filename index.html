<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amalia Popescu</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/x-icon" href="./Images/BlueDot.svg">
</head>
<body>
    <div class="homepage">
        <div class="menu">
            <div class="text">
                <a href="./index.html">Amalia Popescu</a><br>
                <a href="./about.html">About</a>
                <p id="project-title"></p>
            </div>
        </div>
        <a href="dance.html"><button class="dance" style="background-color: #0000c1;"></button></a>
        <div class="content">
            <a href="./krump.html" data-title="This is Krump">
                <img class="krump" src="./Images/WebRes/krumpSpread3_MainScreen1080px.jpg" alt="" height="400">
            </a>
            <a href="/flaxman.html" data-title="Flaxman Typeface">
                <img class="flaxman" src="./Images/WebRes/flax_Main_1080px.jpg" alt="" height="400">
            </a>
            <a href="./piedtype.html" target="_blank" data-title="Pied Type">
                <img class="piedtype" src="./Images/WebRes/piedtype_main_1080px.jpg" alt="" height="400">
            </a>
            <a href="./diss.html" data-title="Development of Kinetic Type">
                <img class="diss" src="./Images/WebRes/diss_Main_1080px.jpg" alt="" height="400">
            </a>
            <a href="./upperroom.html" data-title="UpperRoom Typeface">
                <img class="upperroom" src="./Images/WebRes/UpperRoomMain_1080px.png" alt="" height="400">
            </a>
            <a href="./comrade.html" data-title="Comrade Typeface">
                <img class="comrade" src="./Images/WebRes/Comrade_MainImage_1080px.png" alt="" height="400">
            </a>

                <img class="collab" src="./Images/WebRes/CollabCover_1080px.png" alt="" height="400">
            </a>
        </div>
    </div>
<script>
    const projectTitle = document.getElementById('project-title');
    const projectLinks = document.querySelectorAll('.content a');

    projectLinks.forEach(link => {
        link.addEventListener('mouseenter', () => {
            projectTitle.textContent = link.dataset.title;
        });

        link.addEventListener('mouseleave', () => {
            projectTitle.textContent = '';
        });
    });
</script>
</body>
</html>
